channel-type.hdl.busInvalidPacketCount.label = Bus Invalid Packet Count
channel-type.hdl.busInvalidPacketCount.description = Total count of unparseable/invalid packets seen since the bridge started.
channel-type.hdl.busMessageRate.label = Bus Message Rate
channel-type.hdl.busMessageRate.description = Average HDL bus message rate over the last update period (see the "busstats" console command for a detailed breakdown).
channel-type.hdl.control.label = Control
channel-type.hdl.control.description = Device control (UP, DOWN, MOVE/STOP, closure 0-100%)
channel-type.hdl.curtainduration.label = Curtain Travel Duration
channel-type.hdl.curtainduration.description = Full-travel duration for this curtain channel, as configured on the device itself and queried automatically at startup - use this value as the "uptime"/"downtime" parameter for the ROLLERSHUTTERPOSITION profile on the matching Shutter*Control channel's Item link (see the README's "Curtain Position (MW02)" section). Unit assumed seconds, not formally confirmed. Stays undefined if the device doesn't respond to the query.
channel-type.hdl.dateTime.label = DateTime
channel-type.hdl.dateTime.description = Current time
channel-type.hdl.dimmer.label = DimmerCh
channel-type.hdl.dimmer.description = Dim the Channel
channel-type.hdl.fhmode.label = Floor Heating Mode
channel-type.hdl.fhmode.description = DLP Floor Heating Mode Setting
channel-type.hdl.fhmode.state.option.Normal = Normal
channel-type.hdl.fhmode.state.option.Day = Day
channel-type.hdl.fhmode.state.option.Night = Night
channel-type.hdl.fhmode.state.option.Away = Away
channel-type.hdl.fhmode.state.option.Timer = Timer
channel-type.hdl.fhtemperaturtype.label = Floor Heating Temperature Unit
channel-type.hdl.fhtemperaturtype.description = Temperature unit (C or F) the DLP panel is reporting floor heating setpoints in.
channel-type.hdl.fhtemperaturtype.state.option.C = C
channel-type.hdl.fhtemperaturtype.state.option.F = F
channel-type.hdl.fhtimer.label = Floor Heating Timer Period
channel-type.hdl.fhtimer.description = Which schedule period (Day or Night) is currently active; only meaningful when FHMode is Timer.
channel-type.hdl.fhtimer.state.option.Day = Day
channel-type.hdl.fhtimer.state.option.Night = Night
channel-type.hdl.musiccommand.label = Music Command
channel-type.hdl.musiccommand.description = Raw command the panel's "Music" tab sends its onboard Z-Audio engine when a Play/Stop/ source button is pressed (e.g. "ON", "SRC+") - confirmed via real hardware capture that this panel family talks a plain-text "*Z<zone><command>" protocol here regardless of what's configured in the HDL Setup Tool's Music CMD list. Updates on every button press, including repeats of the same command, so rules should use an "received update" trigger rather than "changed" if you need every press to fire. The vocabulary beyond "ON"/"SRC+" is not fully mapped yet - treat unfamiliar values as new data points, not something already understood.
channel-type.hdl.readonlyswitch.label = Status
channel-type.hdl.readonlyswitch.description = Read-only status reported by the panel via Response_Panel_Control - confirmed via the official HDL-BUS Pro operation codes reference doc (2026-08-22), not yet independently confirmed against real hardware traffic for this specific field.
channel-type.hdl.set_temp.label = Setpoint Temperature
channel-type.hdl.set_temp.description = Thermostat Setpoint temperature
channel-type.hdl.switch.label = Switch
channel-type.hdl.switch.description = Switch Relay
channel-type.hdl.temperature.label = Temperature
channel-type.hdl.temperature.description = Current Temperature

# channel types config

channel-type.config.hdl.UVSwitch.switchNumber.label = Switch Number
channel-type.config.hdl.UVSwitch.switchNumber.description = Which HDL universal switch number this channel represents (see the HDL Setup Tool). HDL's documented range is 1-248; on a Logic module (ML01) specifically, only 201-248 are valid (each Logic module gets 2 reserved numbers in that range) - numbers below 201 won't mean anything there.
