# add-on

addon.hdl.name = openHAB HDL Binding
addon.hdl.description = This is the binding for HDL

# thing types

thing-type.hdl.AC.label = AC Control (send-only)
thing-type.hdl.AC.description = Sends AC control commands (Control_AC) to a dedicated HDL AC gateway device - not a DLP panel's own AC display (see ACMode/ACFanSpeed on MPL8_48_FH for that). Send-only: the gateway that answers these commands reports a product code this binding doesn't recognize, so status can't be read back - every channel here is write-only and has no confirmed state. Implemented from the official "HDL-BUS Pro operation codes" reference document (2026-08-22), not confirmed against real hardware - no AC gateway was available to test against. See the README's "AC Control" section before using this.
thing-type.hdl.MDT04015.label = HDL Dimmer 4x1.5A
thing-type.hdl.MDT04015.description = Dimmer 4x1.5A - Universal
thing-type.hdl.MDT0601.label = HDL Dimmer 6x1A
thing-type.hdl.MDT0601.description = Dimmer 6x1A - Universal
thing-type.hdl.MFH06.label = Floor Heating Module
thing-type.hdl.MFH06.description = Floor Heating Module. Add a "UVSwitch" channel per universal switch number you need (see the UVSwitch channel-type's "switchNumber" parameter) - there's no fixed channel list here.
thing-type.hdl.ML01.label = Logic
thing-type.hdl.ML01.description = Device type for this Logic Panel. Add a "UVSwitch" channel per universal switch number you need (see the UVSwitch channel-type's "switchNumber" parameter) - there's no fixed channel list here. HDL reserves universal switch numbers 201-248 specifically for Logic modules (2 per module), so switchNumber should be in that range here.
thing-type.hdl.MPL8_48_FH.label = DLP Panel
thing-type.hdl.MPL8_48_FH.description = DLP Panel with AC, Music, Clock and FloorHeating. Add a "UVSwitch" channel per universal switch number you need (see the UVSwitch channel-type's "switchNumber" parameter) - there's no fixed channel list here.
thing-type.hdl.MPT04.label = Digital Panel
thing-type.hdl.MPT04.description = Digital touch switch with 4 buttons
thing-type.hdl.MR04xx.label = Relay 4 Channel
thing-type.hdl.MR04xx.description = For all relays with 4 channels
thing-type.hdl.MR08xx.label = Relay 8 Channel
thing-type.hdl.MR08xx.description = For all relays with 8 channels
thing-type.hdl.MR12xx.label = Relay 12 Channel
thing-type.hdl.MR12xx.description = For all relays with 12 channels
thing-type.hdl.MR16xx.label = Relay 16 Channel
thing-type.hdl.MR16xx.description = For all relays with 16 channels
thing-type.hdl.MRDA06.label = HDL Dimmer 6x1A
thing-type.hdl.MRDA06.description = Ballast Controller, 6 Channels, 0-10V
thing-type.hdl.MS08.label = Sensor with 8 functions
thing-type.hdl.MS08.description = Sensor with 8 functions
thing-type.hdl.MS12.label = Sensor with 12 functions
thing-type.hdl.MS12.description = Sensor with 12 functions
thing-type.hdl.MS24.label = Sensor Input Module
thing-type.hdl.MS24.description = Sensor Input Module with 24 Dry Contact channels
thing-type.hdl.MW02.label = Curtain Controls
thing-type.hdl.MW02.description = Curtain controller for controlling curtains (2 channels)
thing-type.hdl.Scene.label = Scene
thing-type.hdl.Scene.description = Triggers an existing scene, programmed via the HDL Buspro Setup Tool, from openHAB. This is not a physical device - Subnet/DeviceID identify which device on the bus to send the trigger to (any device that is a member of the target area works), Area/Scene identify which scene to run.
thing-type.hdl.Scene.channel.Trigger.description = Sending ON triggers the configured scene. The state is not read back from the bus - this only sends a Scene_Control command, it does not track the scene's resulting channel values (see the DimChannel/RelayCh channels on the affected dimmer/relay Things for that).
thing-type.hdl.bridge.label = HDL server
thing-type.hdl.bridge.description = This bridge represents a HDL server.

